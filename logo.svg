<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#5a1010"/>
      <stop offset="60%" stop-color="#2a0505"/>
      <stop offset="100%" stop-color="#140202"/>
    </radialGradient>
    <linearGradient id="hat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b80000"/>
      <stop offset="100%" stop-color="#7a0000"/>
    </linearGradient>
    <linearGradient id="beard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8b060"/>
      <stop offset="100%" stop-color="#b87028"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fundo circular -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#3a0a0a" stroke-width="2"/>

  <!-- Mira de sniper (anel externo tracejado) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#d4a017" stroke-width="3" stroke-dasharray="14 8" opacity="0.7"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="#d4a017" stroke-width="2" opacity="0.5"/>

  <!-- Linhas da mira -->
  <g stroke="#d4a017" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="40"  x2="256" y2="90"/>
    <line x1="256" y1="422" x2="256" y2="472"/>
    <line x1="40"  y1="256" x2="90"  y2="256"/>
    <line x1="422" y1="256" x2="472" y2="256"/>
  </g>

  <!-- Ponto central da mira -->
  <circle cx="256" cy="256" r="4" fill="#d4a017"/>

  <!-- Gnomo (silhueta estilizada no centro) -->
  <g filter="url(#shadow)">
    <!-- Chapéu pontudo -->
    <path d="M 256 110 L 180 240 L 332 240 Z" fill="url(#hat)"/>
    <ellipse cx="256" cy="245" rx="82" ry="12" fill="#5a0000"/>
    <!-- Cabeça -->
    <ellipse cx="256" cy="295" rx="68" ry="58" fill="#f4d4a8"/>
    <!-- Orelhas pontudas -->
    <path d="M 192 285 Q 170 295 180 320 Q 195 315 200 300 Z" fill="#e8c090"/>
    <path d="M 320 285 Q 342 295 332 320 Q 317 315 312 300 Z" fill="#e8c090"/>
    <!-- Nariz -->
    <ellipse cx="256" cy="305" rx="14" ry="22" fill="#d49870"/>
    <!-- Barba volumosa -->
    <path d="M 198 300 Q 180 360 220 395 Q 240 410 256 405 Q 272 410 292 395 Q 332 360 314 300 Q 300 340 256 345 Q 212 340 198 300 Z" fill="url(#beard)"/>
    <!-- Olhos (simples) -->
    <circle cx="232" cy="290" r="4" fill="#1a1a1a"/>
    <circle cx="280" cy="290" r="4" fill="#1a1a1a"/>
  </g>

  <!-- X vermelho sobre o gnomo (marca de caça) -->
  <g stroke="#ff2020" stroke-width="12" stroke-linecap="round" opacity="0.75">
    <line x1="180" y1="200" x2="332" y2="400"/>
    <line x1="332" y1="200" x2="180" y2="400"/>
  </g>
</svg>
